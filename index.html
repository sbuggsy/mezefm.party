<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meze FM</title>

  <link rel="icon" href="favicon.png" type="image/x-icon" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" />

  <style>
    body {
      font-family: 'Montserrat', sans-serif;
      background-color: #f2f2f2;
      background-image: url('Background3.jpg');
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center;
      background-attachment: fixed;
      color: #333;
      margin: 0;
      padding: 0;
    }

    header {
      margin-bottom: 20px;
      text-align: center;
    }

    header img {
      display: block;
      max-width: 50%;
      height: auto;
      margin: 120px auto;
    }

    section {
      padding: 20px;
      margin: 20px auto;
      background-color: #333333;
      color: white;
      border-radius: 10px;
      max-width: calc(100% - 40px);
      box-sizing: border-box;
    }

    .player-chat-container {
      display: flex;
      gap: 20px;
      align-items: stretch;
      justify-content: center;
      flex-wrap: nowrap;
    }

    .player-chat-container .radio-container,
    .player-chat-container .chat-container {
      flex: 1;
      min-width: 0;
    }

    .radio-container {
      text-align: center;
    }

    .radio-container iframe {
      width: 100%;
      max-width: 100%;
      height: 330px;
      border: 0;
    }

    /* CHAT */
    .chat-container {
      background-color: #222;
      border-radius: 10px;
      padding: 10px;
      display: flex;
      flex-direction: column;

      /* keep same size; do not grow with text */
      height: 330px;
      min-height: 330px;
      max-height: 330px;
      box-sizing: border-box;
    }

    .chat-header {
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 8px;
      font-size: 14px;
      flex: 0 0 auto;
    }

    .chat-messages {
      flex: 1 1 auto;
      background-color: #111;
      border-radius: 8px;
      padding: 10px;

      /* scrollbar stays inside */
      overflow-y: auto;
      overflow-x: hidden;

      font-size: 13px;
      min-height: 0; /* important for flex scrolling */
    }

    .chat-message {
      margin-bottom: 8px;
      line-height: 1.4;

      /* prevent stretching layout */
      word-break: break-word;
      overflow-wrap: anywhere;
      white-space: normal;
    }

    .chat-message.from-user strong { color: #ffcc00; }
    .chat-message.from-bot strong { color: #66d9ff; }

    .chat-input-area {
      margin-top: 10px;
      display: flex;
      gap: 8px;
      flex: 0 0 auto;
    }

    .chat-input-area input[type="text"] {
      flex: 1;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #555;
      background: #333;
      color: #fff;
      outline: none;
      min-width: 0;
    }

    .chat-send-btn {
      padding: 8px 16px;
      border-radius: 6px;
      border: none;
      background-color: #ffcc00;
      color: #333;
      cursor: pointer;
      font-weight: 700;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .chat-send-btn:hover { background-color: #ffd633; }

    @media screen and (max-width: 768px) {
      .player-chat-container { flex-direction: column; }
      header img { margin: 60px auto; max-width: 80%; }
      .radio-container iframe { height: 330px; }
      .chat-container { height: 330px; min-height: 330px; max-height: 330px; }
    }
  </style>
</head>

<body>
  <header>
    <img src="logo_without_background.png" alt="Meze FM Logo" />
  </header>

  <section id="home">
    <div class="player-chat-container">
      <div class="radio-container">
        <iframe src="https://media2.streambrothers.com:2020/public/8054?mount=&" frameborder="0"></iframe>
      </div>

      <div class="chat-container">
        <div class="chat-header">Chat with MezeBot</div>
        <div id="chat-messages" class="chat-messages"></div>

        <form id="chat-form" class="chat-input-area">
          <input id="chat-input" type="text" placeholder="Say @help for commands..." autocomplete="off" />
          <button class="chat-send-btn" type="submit">Send</button>
        </form>
      </div>
    </div>
  </section>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const WEBHOOK_URL = "https://coralie-flectionless-karlyn.ngrok-free.dev/webhook/chat";

      const form = document.getElementById('chat-form');
      const input = document.getElementById('chat-input');
      const messages = document.getElementById('chat-messages');

      // SESSION ID (persistent per browser)
      const sessionId =
        localStorage.getItem('meze_session') ||
        (() => {
          const id = 'meze-' + Math.random().toString(16).slice(2);
          localStorage.setItem('meze_session', id);
          return id;
        })();

      // Initial greeting (once per page load)
      addMessage('MezeBot', "Hey 👋 I'm Mia. Write commands, or just say what is your name :)");

      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const text = input.value.trim();
        if (!text) return;

        addMessage('You', text);
        input.value = '';

        const thinkingId = addMessage('MezeBot', '...');

        try {
          const response = await fetch(WEBHOOK_URL, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'ngrok-skip-browser-warning': 'true'
            },
            body: JSON.stringify({
              message: text,
              sessionId: sessionId
            })
          });

          const raw = await response.text();

          if (!response.ok) {
            throw new Error(`HTTP ${response.status}: ${raw}`);
          }

          let data;
          try {
            data = JSON.parse(raw);
          } catch (parseErr) {
            throw new Error(`Not JSON: ${raw}`);
          }

          // n8n often returns an array: [ { output: "..." } ]
          const payload = Array.isArray(data) ? data[0] : data;

          const reply =
            payload?.output ||
            payload?.reply ||
            payload?.message ||
            payload?.text ||
            "Command processed!";

          updateMessage(thinkingId, 'MezeBot', reply);

        } catch (err) {
          console.error(err);
          updateMessage(thinkingId, 'MezeBot', `Error: ${err.message || err}`);
        }
      });

      function addMessage(sender, text) {
        const id = 'msg-' + Math.random().toString(16).slice(2);
        const div = document.createElement('div');
        div.className = 'chat-message ' + (sender === 'You' ? 'from-user' : 'from-bot');
        div.dataset.id = id;
        div.innerHTML = `<strong>${sender}:</strong> <span>${escapeHtml(text)}</span>`;
        messages.appendChild(div);
        messages.scrollTop = messages.scrollHeight;
        return id;
      }

      function updateMessage(id, sender, text) {
        const el = messages.querySelector(`[data-id="${id}"]`);
        if (!el) return;
        el.innerHTML = `<strong>${sender}:</strong> <span>${escapeHtml(text)}</span>`;
        messages.scrollTop = messages.scrollHeight;
      }

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }
    });
  </script>
</body>
</html>
